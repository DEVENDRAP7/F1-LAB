name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The what-if model ships as a Python reference and a JS port that
      # must agree bit-for-bit on a committed fixture; running the Python
      # suite here means a drift on either side fails this same workflow.
      - name: Run pipeline unit tests (Python side of the parity contract)
        run: |
          pip install -q numpy pytest
          python -m pytest pipeline/tests -q

      # Regenerates the Aero Rig's data from whatever racing lines the
      # telemetry backfill has committed, so the rig is never more than
      # one deploy behind the published position traces.
      - name: Export aero signature
        run: node scripts/aero_export.mjs --out public/data/2026/aero.json

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
