name: Refresh data

on:
  schedule:
    # Every Tuesday at 06:00 UTC.
    - cron: '0 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to dispatch deploy.yml after the data commit (see last step)

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          # Keyed on year+week rather than session ID: FastF1's own cache
          # is content-addressed per session internally, so a broad key
          # with a long restore-keys fallback still avoids most re-downloads
          # while keeping the cache action itself simple.
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (ingest -> derive -> export)
        working-directory: pipeline
        run: python run_refresh.py --year 2026

      - name: Validate exported data (hard gate)
        working-directory: pipeline
        run: |
          python -m pytest tests -q
          python validate_export.py

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A full refresh takes several minutes, so main can move underneath
      # it — a push during the run once rejected an otherwise good export
      # and the whole refresh was lost. Rebase onto whatever landed and
      # retry. The data files are written only by this workflow, so a
      # rebase conflict means something genuinely unexpected: fail rather
      # than resolve it blindly.
      - name: Commit and push if data changed
        id: commit
        run: |
          git add config/season_2026.json public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Refresh 2026 season data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase conflict on refreshed data — resolve by hand."
              exit 1
            fi
            sleep 5
          done

          echo "::error::Could not push refreshed data after 3 attempts."
          exit 1

      # Pushes made with GITHUB_TOKEN do not fire `on: push` workflows
      # (GitHub's recursion guard), so the data commit above would never
      # reach Pages on its own. workflow_dispatch is exempt from that
      # rule — dispatch the deploy explicitly.
      - name: Trigger site deploy with the fresh data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
