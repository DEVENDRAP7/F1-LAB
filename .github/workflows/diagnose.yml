name: Diagnose data sources

# Manual only. Prints how each upstream source responds from a runner so
# a telemetry outage can be root-caused (IP block vs. changed upstream
# path vs. season not published) instead of guessed at. Writes nothing.
on:
  workflow_dispatch:
    inputs:
      year:
        description: Season to probe
        required: false
        default: '2026'
      round:
        description: Round to load with FastF1
        required: false
        default: '1'
      session:
        description: FastF1 session identifier (FP1, Q, R, ...)
        required: false
        default: 'Q'
      circuit:
        description: circuitId to probe past editions of instead of the live-timing probe
        required: false
        default: ''
      openf1:
        description: probe OpenF1 for telemetry channels instead of the live-timing probe
        type: boolean
        required: false
        default: false
      openf1_window:
        description: check that OpenF1's lap-window filter is actually applied
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Probe sources
        working-directory: pipeline
        run: |
          python diagnose_sources.py \
            --year "${{ inputs.year }}" \
            --round "${{ inputs.round }}" \
            --session "${{ inputs.session }}" \
            --circuit "${{ inputs.circuit }}" \
            ${{ inputs.openf1 && '--openf1' || '' }} \
            ${{ inputs.openf1_window && '--openf1-window' || '' }}
